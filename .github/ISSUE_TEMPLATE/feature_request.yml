name: Feature request
description: Suggest a new capability, template improvement, or example task
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the evaluation problem you
        are trying to solve, not only the implementation you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What kind of task or evaluation is currently hard to express?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or schema change you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Task schema
        - Prompt templates
        - Renderer / CLI
        - Example tasks
        - Documentation
        - Other
    validations:
      required: true
