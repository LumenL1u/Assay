[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "assay"
version = "0.1.0"
description = "Assay：只定义目标、不规定路径的 Agent 能力评测框架"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Assay contributors" }]
requires-python = ">=3.11"
keywords = ["agent", "evaluation", "benchmark", "prompt", "llm", "task", "assay"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["ruff>=0.6.0"]

[project.scripts]
assay = "assay.cli:main"

[project.urls]
Homepage = "https://github.com/LumenL1u/Assay"
Repository = "https://github.com/LumenL1u/Assay"
Issues = "https://github.com/LumenL1u/Assay/issues"

[tool.setuptools]
packages = ["assay", "assay.templates"]

[tool.setuptools.package-data]
"assay.templates" = ["*.md"]
assay = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
