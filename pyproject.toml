[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-kit"
version = "0.1.0"
description = "通用 Agent 任务评测框架：任务定义、提示词渲染与评分契约"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "agent-eval contributors" }]
requires-python = ">=3.11"
keywords = ["agent", "evaluation", "benchmark", "prompt", "llm", "task"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["ruff>=0.6.0"]

[project.scripts]
agent-eval = "evalkit.cli:main"

[tool.setuptools]
packages = ["evalkit", "evalkit.templates"]

[tool.setuptools.package-data]
"evalkit.templates" = ["*.md"]
evalkit = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
