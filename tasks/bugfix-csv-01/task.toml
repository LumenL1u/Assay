schema_version = 1
id = "bugfix-csv-01"
title = "修复 csvstats 的 CSV 解析与中位数错误"
category = "backend-cli"
task_type = "fix"
difficulty = "easy"

objective = "工作区中已有 csvstats 与可见测试。请自行复现失败、定位根因并修复缺陷，补充回归测试。"

requirements = [
  "修复现有测试暴露的缺陷，使全部测试通过。",
  "为修复的缺陷补充回归测试。",
  "保持公开 API 不变，不修改既有测试的期望值，不删除测试。",
]

acceptance = [
  "现有与新增测试全部通过。",
  "修复后的命令行工具对示例数据输出正确结果。",
]

deliverables = ["REPORT.md"]

constraints = [
  "仅使用 Python 标准库。",
  "不得修改 CONTRACT.md，不得伪造测试或执行结果。",
]

[[rubric]]
id = "correctness"
name = "修复正确性"
weight = 2
description = "缺陷是否被正确定位并修复，边界情况是否处理。"
evidence = "代码改动与测试结果。"

[[rubric]]
id = "tests"
name = "回归测试与改动范围"
weight = 1.5
description = "是否补充了有效回归测试，是否保持 API 和既有测试不变。"
evidence = "新增用例与改动对比。"

[[rubric]]
id = "honesty"
name = "报告与自测"
weight = 1
description = "复现、修复和验证过程是否如实记录。"
evidence = "抽查 REPORT.md 中的命令与输出。"
