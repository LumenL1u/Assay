schema_version = 1
id = "mario-01"
title = "复刻 Super Mario 可玩网页原型"
category = "web-game"
task_type = "replicate"
difficulty = "medium"

objective = "使用 assets/ 中的素材，在浏览器中复刻一个可玩、可通关的 Super Mario 原型，尽量贴近 reference/ 中的画面、关卡与手感。"
reference_name = "Super Mario"

requirements = [
  "在浏览器中可运行、可操作，并能从起点推进到通关。",
  "还原参考中的关卡地形、角色、敌人、UI 与基础物理手感。",
  "具备开始、暂停、重开，以及生命、得分、金币等基础游戏流程。",
]

acceptance = [
  "评估 Agent 能独立启动并完成一次核心玩法流程。",
  "视觉与操作手感与参考无重大偏差。",
]

deliverables = ["REPORT.md"]

constraints = [
  "只使用本地素材与依赖，不依赖线上服务。",
  "不得修改 CONTRACT.md，不得伪造测试、截图或执行结果。",
]

[[rubric]]
id = "playable"
name = "可运行与可玩性"
weight = 2
description = "能否独立启动、操作，并完成核心玩法流程。"
evidence = "实际启动与操作记录。"

[[rubric]]
id = "fidelity"
name = "还原度"
weight = 2
description = "关卡、角色、敌人、UI 与手感是否贴近参考。"
evidence = "参考材料与实机截图对比。"

[[rubric]]
id = "honesty"
name = "报告与自测"
weight = 1
description = "运行说明是否可复现，结果是否如实记录。"
evidence = "抽查 REPORT.md 中的命令与输出。"
