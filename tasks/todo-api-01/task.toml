schema_version = 1
id = "todo-api-01"
title = "实现 Todo REST API"
category = "backend-api"
task_type = "build"
difficulty = "medium"

objective = "实现一个本地可运行的 Todo REST API，支持增删改查、状态过滤、输入校验与持久化。技术栈、接口细节和运行方式由你决定，并在报告中说明。"

requirements = [
  "支持 Todo 的创建、列表、读取、更新和删除。",
  "支持按完成状态过滤；非法输入返回明确的客户端错误，不存在的资源返回 404。",
  "数据持久化到本地，服务重启后仍可读取。",
]

acceptance = [
  "评估 Agent 能按项目说明启动服务，并独立完成 CRUD、过滤、错误处理和重启持久化验证。",
]

deliverables = ["REPORT.md"]

constraints = [
  "只使用本地依赖，不依赖外部数据库或在线服务。",
  "不得修改 CONTRACT.md，不得伪造测试或执行结果。",
]

[[rubric]]
id = "functionality"
name = "功能正确性"
weight = 2.5
description = "CRUD、过滤、错误处理与持久化是否符合目标。"
evidence = "独立请求记录与测试结果。"

[[rubric]]
id = "quality"
name = "工程质量"
weight = 1.5
description = "结构、依赖、测试与文档是否支撑可维护的交付。"
evidence = "代码走查与项目自带测试。"

[[rubric]]
id = "honesty"
name = "报告与自测"
weight = 1
description = "运行说明是否可复现，结果是否如实记录。"
evidence = "抽查 REPORT.md 中的命令与输出。"
